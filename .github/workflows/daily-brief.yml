name: 데일리 마켓 브리핑

on:
  schedule:
    # 22:00 UTC = 07:00 KST
    # UTC 일~목 = KST 월~금 아침
    #   일 22:00 UTC → 월 07:00 KST (직전 거래일 = 지난 금요일 마감)
    #   목 22:00 UTC → 금 07:00 KST (직전 거래일 = 목요일 마감)
    - cron: "0 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

env:
  PAGES_BASE: https://psyops42-art.github.io/market-brief

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬 패키지 설치
        run: pip install --quiet -r requirements.txt

      - name: 렌더링 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf fonts-noto-cjk fonts-noto-cjk-extra

      - name: 1단계 · 시장데이터 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetch_data.py --out data.json

      - name: 2단계 · 헤드라인 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python make_brief.py --data data.json --out brief.json

      - name: 3단계 · 렌더링 (대시보드 + 화면캡처 썸네일)
        run: python render.py --data data.json --brief brief.json --base "$PAGES_BASE" --out out

      - name: 4단계 · 배포
        run: |
          set -o pipefail
          SLUG=$(TZ=Asia/Seoul date +%Y-%m-%d)

          echo "▶ 산출물 복사"
          ls -la out/
          mkdir -p docs
          cp out/*.html docs/ || { echo "!! HTML 복사 실패"; exit 1; }
          cp out/*.png  docs/ || { echo "!! PNG 복사 실패"; exit 1; }
          cp out/report.json docs/report.json

          echo "▶ 아카이브 목록 생성"
          python build_index.py --base "$PAGES_BASE"

          echo "▶ 커밋"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          # 커밋 메시지에 링크를 넣으면 GitHub 푸시 알림 메일의
          # "Log Message" 칸에 그대로 표시됩니다.
          git commit \
            -m "브리핑 $SLUG 자동 배포" \
            -m "▼ 카톡에 붙여넣을 링크" \
            -m "$PAGES_BASE/$SLUG.html" \
            -m "아카이브 : $PAGES_BASE/"

          echo "▶ 푸시"
          # 작업 중 저장소를 직접 수정하면 푸시가 거부될 수 있어 한 번 재시도합니다.
          if ! git push; then
            echo "   1차 실패 — 원격 변경분을 받아 재시도합니다"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            git push
          fi
          echo "▶ 배포 완료 : $PAGES_BASE/$SLUG.html"

      - name: 5단계 · 알림 (이슈 + 메일)
        if: success()
        continue-on-error: true          # 알림 실패가 배포 성공을 뒤엎지 않도록
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py --report out/report.json --base "$PAGES_BASE" --run "${{ github.run_number }}"

      - name: 결과 요약
        if: always()
        run: |
          SLUG=$(TZ=Asia/Seoul date +%Y-%m-%d)
          V=${{ github.run_number }}
          python - "$SLUG" "$V" "$PAGES_BASE" "${{ job.status }}" >> $GITHUB_STEP_SUMMARY <<'PY'
          import json, os, sys
          slug, ver, base, status = sys.argv[1:5]
          rep = {}
          for path in ("out/report.json", "docs/report.json"):
              if os.path.exists(path):
                  rep = json.load(open(path, encoding="utf-8")); break
          unresolved = rep.get("unresolved", ["렌더 리포트 없음 — 실행이 중단되었습니다"])
          issues = rep.get("brief_issues", [])
          ok = status == "success"
          icon = "✅" if ok and not unresolved and not rep.get("stale") else ("⚠️" if ok else "❌")
          note = "" if ok else " — 실행 실패, 아래 링크는 아직 생성되지 않았습니다"
          if ok and (unresolved or rep.get("stale")):
              note = " — 배포됐지만 확인이 필요한 항목이 있습니다"
          print(f"## {icon} 데일리 마켓 브리핑 {slug}{note}\n")
          print("| 항목 | 링크 |")
          print("|---|---|")
          print(f"| 공유 링크 | {base}/{slug}.html?v={ver} |")
          print(f"| 썸네일 | {base}/og-{slug}.png?v={ver} |")
          print(f"| 아카이브 | {base}/ |\n")
          print("> 카톡에는 `?v=` 없이 `.html` 까지만 붙여넣으세요. 위 링크는 캐시를 피해 확인용입니다.\n")
          stale = rep.get("stale", [])
          print(f"**기준일** {rep.get('cutoff', '-')}\n")
          print("**화면에 '확인필요'로 표기된 항목**")
          print("\n".join(f"- {x}" for x in unresolved) if unresolved else "- 없음")
          print("\n**기준일보다 오래된 값 ('최신 아님' 표기)**")
          print("\n".join(f"- {x}" for x in stale) if stale else "- 없음")
          print("\n**헤드라인 자체 점검**")
          print("\n".join(f"- {x}" for x in issues) if issues else "- 통과")
          print(f"\n<sub>수집 성공 {len(rep.get('collected', []))}종</sub>")
          PY

      - name: 실패 시 아티팩트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            data.json
            brief.json
            out/
            docs/report.json
          retention-days: 7
