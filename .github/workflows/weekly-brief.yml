name: 주간 마켓 브리핑

on:
  schedule:
    # 21:00 UTC 일요일 = 06:00 KST 월요일
    # 데일리(22:00 UTC = 07:00 KST)보다 1시간 먼저 돌아,
    # 담당자가 데일리를 받기 전에 지난주 정리를 먼저 볼 수 있게 한다.
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-brief
  cancel-in-progress: false

env:
  PAGES_BASE: https://psyops42-art.github.io/market-brief

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬 패키지 설치
        run: pip install --quiet -r requirements.txt

      - name: 렌더링 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf fonts-noto-cjk fonts-noto-cjk-extra

      - name: 1단계 · 주간 데이터 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetch_data_weekly.py --out data_weekly.json

      - name: 2단계 · 주간 리뷰·인사이트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python make_brief_weekly.py --data data_weekly.json --out brief_weekly.json

      - name: 3단계 · 렌더링 (대시보드 + 화면캡처 썸네일)
        run: |
          python render_weekly.py \
            --data data_weekly.json --brief brief_weekly.json \
            --base "$PAGES_BASE" --out out

      - name: 4단계 · 배포
        run: |
          set -o pipefail
          SLUG=$(ls out/weekly-*.html | head -1 | xargs basename | sed 's/\.html$//')
          echo "▶ 산출물 확인 ($SLUG)"
          ls -la out/

          mkdir -p docs
          cp out/*.html docs/ || { echo "!! HTML 복사 실패 — 렌더 단계를 확인하세요"; exit 1; }
          # 썸네일이 없어도 본문 배포는 계속한다 (썸네일 실패로 전체가 죽지 않도록)
          if ls out/*.png >/dev/null 2>&1; then
            cp out/*.png docs/
          else
            echo "!! 썸네일 PNG 없음 — 3단계 로그의 'OG 썸네일 생성 실패'를 확인하세요 (배포는 계속)"
          fi
          cp out/report_weekly.json docs/report_weekly.json

          echo "▶ 아카이브 목록 생성"
          python build_index.py --base "$PAGES_BASE"

          echo "▶ 커밋"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit \
            -m "주간 브리핑 $SLUG 자동 배포" \
            -m "▼ 카톡에 붙여넣을 링크" \
            -m "$PAGES_BASE/$SLUG.html" \
            -m "아카이브 : $PAGES_BASE/"

          echo "▶ 푸시"
          # 데일리 워크플로가 같은 시간대에 docs/ 를 밀어 넣으면 푸시가 거부될 수 있어
          # 원격 변경분을 받아 두 번까지 재시도한다.
          PUSHED=0
          for i in 1 2 3; do
            if git push; then PUSHED=1; break; fi
            echo "   ${i}차 실패 — 원격 변경분을 받아 재시도합니다"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            sleep 5
          done
          if [ "$PUSHED" != "1" ]; then
            echo "!! 푸시 실패 — 원격 상태와 권한(contents: write)을 확인하세요"
            exit 1
          fi
          echo "▶ 배포 완료 : $PAGES_BASE/$SLUG.html"

      - name: 5단계 · 알림 (이슈 + 메일)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python notify.py --report out/report_weekly.json \
            --base "$PAGES_BASE" --run "${{ github.run_number }}" \
            --label "주간 마켓 브리핑"

      - name: 결과 요약
        if: always()
        run: |
          V=${{ github.run_number }}
          python - "$V" "$PAGES_BASE" "${{ job.status }}" >> $GITHUB_STEP_SUMMARY <<'PY'
          import json, os, sys
          ver, base, status = sys.argv[1:4]
          rep = {}
          for path in ("out/report_weekly.json", "docs/report_weekly.json"):
              if os.path.exists(path):
                  rep = json.load(open(path, encoding="utf-8")); break
          slug = rep.get("slug", "(생성 실패)")
          unresolved = rep.get("unresolved", ["렌더 리포트 없음 — 실행이 중단되었습니다"])
          stale = rep.get("stale", [])
          delayed = rep.get("delayed", [])
          issues = rep.get("brief_issues", [])
          ok = status == "success"
          needs = unresolved or stale or issues or not rep.get("og_ok", True)
          icon = "✅" if ok and not needs else ("⚠️" if ok else "❌")
          note = "" if ok else " — 실행 실패, 아래 링크는 아직 생성되지 않았습니다"
          if ok and needs:
              note = " — 배포됐지만 확인이 필요한 항목이 있습니다"
          print(f"## {icon} 주간 마켓 브리핑 {slug}{note}\n")
          lw, tw = rep.get("last_week", {}), rep.get("this_week", {})
          if lw and tw:
              print(f"**지난주** {lw.get('mon')} ~ {lw.get('fri')}  ·  "
                    f"**이번주** {tw.get('mon')} ~ {tw.get('fri')}\n")
          print("| 항목 | 링크 |")
          print("|---|---|")
          print(f"| 공유 링크 | {base}/{slug}.html?v={ver} |")
          print(f"| 썸네일 | {base}/og-{slug}.png?v={ver} |")
          print(f"| 아카이브 | {base}/ |\n")
          print("> 카톡에는 `?v=` 없이 `.html` 까지만 붙여넣으세요. 위 링크는 캐시를 피해 확인용입니다.\n")
          print("**화면에 '확인필요'로 표기된 항목**")
          print("\n".join(f"- {x}" for x in unresolved) if unresolved else "- 없음")
          print("\n**기준일보다 오래된 값 (허용범위 초과 · 확인 필요)**")
          print("\n".join(f"- {x}" for x in stale) if stale else "- 없음")
          print("\n**생성 내용 자체 점검 (헤드라인·일정 날짜범위)**")
          print("\n".join(f"- {x}" for x in issues) if issues else "- 통과")
          print("\n**썸네일(카톡 미리보기)**")
          print("- 정상 생성" if rep.get("og_ok") else f"- 생성 실패: {rep.get('og_error','원인 미기록')}")
          if delayed:
              print("\n**해외지수 정상 지연 (참고용 · 조치 불필요)**")
              print("\n".join(f"- {x}" for x in delayed))
          print(f"\n<sub>수집 성공 {len(rep.get('collected', []))}종</sub>")
          PY

      - name: 실패 시 아티팩트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-debug-${{ github.run_id }}
          path: |
            data_weekly.json
            brief_weekly.json
            out/
            docs/report_weekly.json
          retention-days: 7
